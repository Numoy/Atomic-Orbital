name: atomic_orbital
description: A Flutter port of the Atomic Orbital game
publish_to: 'none'
version: 2.3.0+44

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  shared_preferences_platform_interface: ^2.4.1
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/ios/
    - assets/fonts/LICENSE-Roboto.txt

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
